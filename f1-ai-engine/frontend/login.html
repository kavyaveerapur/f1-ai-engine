<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2026 AI — Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --red: #e10600;
    --gold: #ffd700;
    --blue: #3b82f6;
    --cyan: #06b6d4;
    --dark: #020617;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--dark);
    color: white;
    font-family: 'Rajdhani', sans-serif;
}

#floating-lines-root {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 0;
    background: #000000;
}

#floating-lines-root canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: rgba(2, 6, 23, 0.18);
}

.racing-line {
    position: fixed;
    left: 0;
    top: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(
        to bottom,
        transparent,
        var(--red),
        var(--gold),
        transparent
    );
    opacity: 0.85;
}

.login-wrap {
    position: relative;
    z-index: 3;
    width: min(430px, calc(100vw - 36px));
}

.login-card {
    padding: 42px;
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 18px;
    background: rgba(2,6,23,0.78);
    backdrop-filter: blur(22px);
    box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        0 0 35px rgba(225,6,0,0.08);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo img {
    width: 92px;
    filter: drop-shadow(0 0 12px rgba(225,6,0,0.55));
}

.eyebrow {
    color: var(--red);
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 10px;
}

h1 {
    font-family: 'Orbitron', monospace;
    font-size: 25px;
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    margin-bottom: 30px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: rgba(255,255,255,0.55);
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.4);
    color: white;
    outline: none;
    font: 600 15px 'Rajdhani', sans-serif;
}

input:focus {
    border-color: rgba(59,130,246,0.75);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.10);
}

button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--red), #a90000);
    box-shadow: 0 6px 24px rgba(225,6,0,0.28);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;

}

button:hover {

    box-shadow: 0 10px 30px rgba(225,6,0,0.42);
}

.error {
    display: none;
    margin-top: 15px;
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid rgba(248,113,113,0.25);
    background: rgba(248,113,113,0.07);
    color: #fca5a5;
    text-align: center;
    font-size: 13px;
}

.demo {
    margin-top: 20px;
    text-align: center;
    color: rgba(255,255,255,0.32);
    font-size: 12px;

}

.demo strong {

}

.home {
    display: block;
    margin-top: 18px;

    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 13px;
}

}

<body>

<div id="floating-lines-root" aria-hidden="true"></div>
<div class="bg-overlay"></div>

<div class="login-wrap">
    <div class="login-card">

        <div class="logo">

<script type="module">
import {
    Scene,
    OrthographicCamera,
    WebGLRenderer,
    PlaneGeometry,
    Mesh,
    ShaderMaterial,
    Vector3,
    Vector2,
    Clock
} from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/*
 * FloatingLines
 *
 * This is the supplied FloatingLines component logic translated from
 * React into the existing vanilla HTML login page.
 *
 * The requested props are intentionally unchanged:
 *
 * linesGradient:
 *   ["#eb2727","#e0d7d7","#000000"]
 * animationSpeed: 1
 * interactive: true
 * bendRadius: 2
 * bendStrength: -0.5
 * mouseDamping: 0.05
 * parallax: true
 * parallaxStrength: 0.2
 *
 * Container:
 *   width: 100%
 *   height: 100%
 */

const MAX_GRADIENT_STOPS = 8;

const linesGradient = ["#eb2727", "#e0d7d7", "#000000"];
const enabledWaves = ["top", "middle", "bottom"];
const lineCount = [6];
const lineDistance = [5];

const topWavePosition = undefined;
const middleWavePosition = undefined;
const bottomWavePosition = {
    x: 2.0,
    y: -0.7,
    rotate: -1
};

const animationSpeed = 1;
const interactive = true;
const bendRadius = 2;
const bendStrength = -0.5;
const mouseDamping = 0.05;
const parallax = true;
const parallaxStrength = 0.2;

function hexToVec3(hex) {
    let value = hex.trim();

    if (value.startsWith("#")) {
        value = value.slice(1);
    }

    let r = 255;
    let g = 255;
    let b = 255;

    if (value.length === 3) {
        r = parseInt(value[0] + value[0], 16);
        g = parseInt(value[1] + value[1], 16);
        b = parseInt(value[2] + value[2], 16);
    } else if (value.length === 6) {
        r = parseInt(value.slice(0, 2), 16);
        g = parseInt(value.slice(2, 4), 16);
        b = parseInt(value.slice(4, 6), 16);
    }

    return new Vector3(
        r / 255,
        g / 255,
        b / 255
    );
}

const vertexShader = `
precision highp float;

void main() {
    gl_Position =
        projectionMatrix *
        modelViewMatrix *
        vec4(position, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform float iTime;
uniform vec3  iResolution;
uniform float animationSpeed;

uniform bool enableTop;
uniform bool enableMiddle;
uniform bool enableBottom;

uniform int topLineCount;
uniform int middleLineCount;
uniform int bottomLineCount;

uniform float topLineDistance;
uniform float middleLineDistance;
uniform float bottomLineDistance;

uniform vec3 topWavePosition;
uniform vec3 middleWavePosition;
uniform vec3 bottomWavePosition;

uniform vec2 iMouse;
uniform bool interactive;

uniform float bendRadius;
uniform float bendStrength;
uniform float bendInfluence;

uniform bool parallax;
uniform float parallaxStrength;
uniform vec2 parallaxOffset;

uniform vec3 lineGradient[8];
uniform int lineGradientCount;

const vec3 BLACK = vec3(0.0);
const vec3 PINK  = vec3(233.0, 71.0, 245.0) / 255.0;
const vec3 BLUE  = vec3(47.0,  75.0, 162.0) / 255.0;

mat2 rotate(float r) {
    return mat2(
        cos(r),
        sin(r),
        -sin(r),
        cos(r)
    );
}

vec3 background_color(vec2 uv) {
    vec3 col = vec3(0.0);

    float y =
        sin(uv.x - 0.2) * 0.3 - 0.1;

    float m =
        uv.y - y;

    col += mix(
        BLUE,
        BLACK,
        smoothstep(0.0, 1.0, abs(m))
    );

    col += mix(
        PINK,
        BLACK,
        smoothstep(0.0, 1.0, abs(m - 0.8))
    );

    return col * 0.5;
}

vec3 getLineColor(
    float t,
    vec3 baseColor
) {
    if (lineGradientCount <= 0) {
        return baseColor;
    }

    vec3 gradientColor;

    if (lineGradientCount == 1) {
        gradientColor =
            lineGradient[0];
    } else {

        float clampedT =
            clamp(t, 0.0, 0.9999);

        float scaled =
            clampedT *
            float(lineGradientCount - 1);

        int idx =
            int(floor(scaled));

        float f =
            fract(scaled);

        int idx2 =
            min(
                idx + 1,
                lineGradientCount - 1
            );

        vec3 c1 =
            lineGradient[idx];

        vec3 c2 =
            lineGradient[idx2];

        gradientColor =
            mix(c1, c2, f);
    }

    return gradientColor * 0.5;
}

float wave(
    vec2 uv,
    float offset,
    vec2 screenUv,
    vec2 mouseUv,
    bool shouldBend
) {
    float time =
        iTime * animationSpeed;

    float x_offset =
        offset;

    float x_movement =
        time * 0.1;

    float amp =
        sin(
            offset +
            time * 0.2
        ) * 0.3;

    float y =
        sin(
            uv.x +
            x_offset +
            x_movement
        ) * amp;

    if (shouldBend) {

        vec2 d =
            screenUv -
            mouseUv;

        float influence =
            exp(
                -dot(d, d) *
                bendRadius
            );

        float bendOffset =
            (mouseUv.y - screenUv.y) *
            influence *
            bendStrength *
            bendInfluence;

        y += bendOffset;
    }

    float m =
        uv.y - y;

    return
        0.0175 /
        max(
            abs(m) + 0.01,
            1e-3
        )
        + 0.01;
}

void mainImage(
    out vec4 fragColor,
    in vec2 fragCoord
) {

    vec2 baseUv =
        (
            2.0 * fragCoord -
            iResolution.xy
        ) /
        iResolution.y;

    baseUv.y *= -1.0;

    if (parallax) {
        baseUv += parallaxOffset;
    }

    vec3 col =
        vec3(0.0);

    vec3 b =
        lineGradientCount > 0
            ? vec3(0.0)
            : background_color(baseUv);

    vec2 mouseUv =
        vec2(0.0);

    if (interactive) {

        mouseUv =
            (
                2.0 * iMouse -
                iResolution.xy
            ) /
            iResolution.y;

        mouseUv.y *= -1.0;
    }

    if (enableBottom) {

        for (
            int i = 0;
            i < bottomLineCount;
            ++i
        ) {

            float fi =
                float(i);

            float t =
                fi /
                max(
                    float(bottomLineCount - 1),
                    1.0
                );

            vec3 lineCol =
                getLineColor(t, b);

            float angle =
                bottomWavePosition.z *
                log(
                    length(baseUv) + 1.0
                );

            vec2 ruv =
                baseUv *
                rotate(angle);

            col +=
                lineCol *
                wave(
                    ruv +
                    vec2(
                        bottomLineDistance * fi +
                        bottomWavePosition.x,
                        bottomWavePosition.y
                    ),
                    1.5 + 0.2 * fi,
                    baseUv,
                    mouseUv,
                    interactive
                ) *
                0.2;
        }
    }

    if (enableMiddle) {

        for (
            int i = 0;
            i < middleLineCount;
            ++i
        ) {

            float fi =
                float(i);

            float t =
                fi /
                max(
                    float(middleLineCount - 1),
                    1.0
                );

            vec3 lineCol =
                getLineColor(t, b);

            float angle =
                middleWavePosition.z *
                log(
                    length(baseUv) + 1.0
                );

            vec2 ruv =
                baseUv *
                rotate(angle);

            col +=
                lineCol *
                wave(
                    ruv +
                    vec2(
                        middleLineDistance * fi +
                        middleWavePosition.x,
                        middleWavePosition.y
                    ),
                    2.0 + 0.15 * fi,
                    baseUv,
                    mouseUv,
                    interactive
                );
        }
    }

    if (enableTop) {

        for (
            int i = 0;
            i < topLineCount;
            ++i
        ) {

            float fi =
                float(i);

            float t =
                fi /
                max(
                    float(topLineCount - 1),
                    1.0
                );

            vec3 lineCol =
                getLineColor(t, b);

            float angle =
                topWavePosition.z *
                log(
                    length(baseUv) + 1.0
                );

            vec2 ruv =
                baseUv *
                rotate(angle);

            ruv.x *= -1.0;

            col +=
                lineCol *
                wave(
                    ruv +
                    vec2(
                        topLineDistance * fi +
                        topWavePosition.x,
                        topWavePosition.y
                    ),
                    1.0 + 0.2 * fi,
                    baseUv,
                    mouseUv,
                    interactive
                ) *
                0.1;
        }
    }

    fragColor =
        vec4(
            col,
            1.0
        );
}

void main() {

    vec4 color =
        vec4(0.0);

    mainImage(
        color,
        gl_FragCoord.xy
    );

    gl_FragColor =
        color;
}
`;

const container =
    document.getElementById(
        "floating-lines-root"
    );

const targetMouse =
    new Vector2(
        -1000,
        -1000
    );

const currentMouse =
    new Vector2(
        -1000,
        -1000
    );

let targetInfluence = 0;
let currentInfluence = 0;

const targetParallax =
    new Vector2(
        0,
        0
    );

const currentParallax =
    new Vector2(
        0,
        0
    );

const topLineCount =
    enabledWaves.includes("top")
        ? lineCount[0] ?? 6
        : 0;

const middleLineCount =
    enabledWaves.includes("middle")
        ? lineCount[1] ?? 6
        : 0;

const bottomLineCount =
    enabledWaves.includes("bottom")
        ? lineCount[2] ?? 6
        : 0;

const topLineDistance =
    enabledWaves.includes("top")
        ? (lineDistance[0] ?? 0.1) * 0.01
        : 0.01;

const middleLineDistance =
    enabledWaves.includes("middle")
        ? (lineDistance[1] ?? 0.1) * 0.01
        : 0.01;

const bottomLineDistance =
    enabledWaves.includes("bottom")
        ? (lineDistance[2] ?? 0.1) * 0.01
        : 0.01;

const scene =
    new Scene();

const camera =
    new OrthographicCamera(
        -1,
        1,
        1,
        -1,
        0,
        1
    );

camera.position.z = 1;

const renderer =
    new WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.domElement.style.width =
    "100%";

renderer.domElement.style.height =
    "100%";

container.appendChild(
    renderer.domElement
);

const uniforms = {

    iTime: {
        value: 0
    },

    iResolution: {
        value:
            new Vector3(
                1,
                1,
                1
            )
    },

    animationSpeed: {
        value:
            animationSpeed
    },

    enableTop: {
        value:
            enabledWaves.includes("top")
    },

    enableMiddle: {
        value:
            enabledWaves.includes("middle")
    },

    enableBottom: {
        value:
            enabledWaves.includes("bottom")
    },

    topLineCount: {
        value:
            topLineCount
    },

    middleLineCount: {
        value:
            middleLineCount
    },

    bottomLineCount: {
        value:
            bottomLineCount
    },

    topLineDistance: {
        value:
            topLineDistance
    },

    middleLineDistance: {
        value:
            middleLineDistance
    },

    bottomLineDistance: {
        value:
            bottomLineDistance
    },

    topWavePosition: {
        value:
            new Vector3(
                topWavePosition?.x ?? 10.0,
                topWavePosition?.y ?? 0.5,
                topWavePosition?.rotate ?? -0.4
            )
    },

    middleWavePosition: {
        value:
            new Vector3(
                middleWavePosition?.x ?? 5.0,
                middleWavePosition?.y ?? 0.0,
                middleWavePosition?.rotate ?? 0.2
            )
    },

    bottomWavePosition: {
        value:
            new Vector3(
                bottomWavePosition?.x ?? 2.0,
                bottomWavePosition?.y ?? -0.7,
                bottomWavePosition?.rotate ?? 0.4
            )
    },

    iMouse: {
        value:
            new Vector2(
                -1000,
                -1000
            )
    },

    interactive: {
        value:
            interactive
    },

    bendRadius: {
        value:
            bendRadius
    },

    bendStrength: {
        value:
            bendStrength
    },

    bendInfluence: {
        value: 0
    },

    parallax: {
        value:
            parallax
    },

    parallaxStrength: {
        value:
            parallaxStrength
    },

    parallaxOffset: {
        value:
            new Vector2(
                0,
                0
            )
    },

    lineGradient: {
        value:
            Array.from(
                {
                    length:
                        MAX_GRADIENT_STOPS
                },
                () =>
                    new Vector3(
                        1,
                        1,
                        1
                    )
            )
    },

    lineGradientCount: {
        value: 0
    }
};

if (
    linesGradient &&
    linesGradient.length > 0
) {

    const stops =
        linesGradient.slice(
            0,
            MAX_GRADIENT_STOPS
        );

    uniforms
        .lineGradientCount
        .value =
        stops.length;

    stops.forEach(
        (hex, i) => {

            const color =
                hexToVec3(hex);

            uniforms
                .lineGradient
                .value[i]
                .set(
                    color.x,
                    color.y,
                    color.z
                );
        }
    );
}

const material =
    new ShaderMaterial({

        uniforms,

        vertexShader,

        fragmentShader,

        transparent: true
    });

const geometry =
    new PlaneGeometry(
        2,
        2
    );

const mesh =
    new Mesh(
        geometry,
        material
    );

scene.add(mesh);

const clock =
    new Clock();

function setSize() {

    const width =
        container.clientWidth || 1;

    const height =
        container.clientHeight || 1;

    renderer.setSize(
        width,
        height,
        false
    );

    const canvasWidth =
        renderer.domElement.width;

    const canvasHeight =
        renderer.domElement.height;

    uniforms
        .iResolution
        .value
        .set(
            canvasWidth,
            canvasHeight,
            1
        );
}

setSize();

window.addEventListener(
    "resize",
    setSize
);

function handlePointerMove(event) {

    const rect =
        renderer
            .domElement
            .getBoundingClientRect();

    const x =
        event.clientX -
        rect.left;

    const y =
        event.clientY -
        rect.top;

    const dpr =
        renderer.getPixelRatio();

    targetMouse.set(
        x * dpr,
        (rect.height - y) * dpr
    );

    targetInfluence = 1.0;

    if (parallax) {

        const centerX =
            rect.width / 2;

        const centerY =
            rect.height / 2;

        const offsetX =
            (x - centerX) /
            rect.width;

        const offsetY =
            -(y - centerY) /
            rect.height;

        targetParallax.set(
            offsetX *
                parallaxStrength,
            offsetY *
                parallaxStrength
        );
    }
}

function handlePointerLeave() {
    targetInfluence = 0.0;
}

if (interactive) {

    renderer
        .domElement
        .addEventListener(
            "pointermove",
            handlePointerMove
        );

    renderer
        .domElement
        .addEventListener(
            "pointerleave",
            handlePointerLeave
        );
}

function renderLoop() {

    uniforms
        .iTime
        .value =
        clock.getElapsedTime();

    if (interactive) {

        currentMouse.lerp(
            targetMouse,
            mouseDamping
        );

        uniforms
            .iMouse
            .value
            .copy(
                currentMouse
            );

        currentInfluence +=
            (
                targetInfluence -
                currentInfluence
            ) *
            mouseDamping;

        uniforms
            .bendInfluence
            .value =
            currentInfluence;
    }

    if (parallax) {

        currentParallax.lerp(
            targetParallax,
            mouseDamping
        );

        uniforms
            .parallaxOffset
            .value
            .copy(
                currentParallax
            );
    }

    renderer.render(
        scene,
        camera
    );

    requestAnimationFrame(
        renderLoop
    );
}

renderLoop();

/* =========================================================
   LOGIN
========================================================= */

const DEMO_USERNAME = "admin";
const DEMO_PASSWORD = "f1admin2026";

const form =
    document.getElementById(
        "loginForm"
    );

const error =
    document.getElementById(
        "error"
    );

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById(
                    "username"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "password"
                )
                .value;

        if (
            username ===
                DEMO_USERNAME &&
            password ===
                DEMO_PASSWORD
        ) {

            sessionStorage.setItem(
                "f1_auth_session",
                "authenticated"
            );

            sessionStorage.setItem(
                "f1_username",
                username
            );

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const requestedNext =
                params.get(
                    "next"
                );

            const safeNext =
                requestedNext &&
                (
                    requestedNext.startsWith(
                        "dashboard.html"
                    ) ||
                    requestedNext ===
                        "index.html"
                )
                    ? requestedNext
                    : "dashboard.html?view=my";

            window.location.replace(
                safeNext
            );

        } else {

            error.style.display =
                "block";
        }
    }
);
</script>
</body>
</html>
